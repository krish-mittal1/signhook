services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - SIGNHOOK_BASE_URL=http://127.0.0.1:8000

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        # Backend POSTs to its own /hooks inbox (same container).
        NEXT_PUBLIC_DEFAULT_TARGET_BASE: http://127.0.0.1:8000
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
